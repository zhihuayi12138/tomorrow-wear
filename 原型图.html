<!DOCTYPE html>

<style>
  :root{
    --ink:#26231F; --ink2:#6E6960; --ink3:#A29C93;
    --line:#EAE6DF; --soft:#F6F4F0; --tile:#F2F2F0;
    --accent:#8C6A4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#EBE8E2;color:var(--ink);padding:44px 40px 72px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .head{max-width:1840px;margin:0 auto 44px}
  .head h1{font-size:28px;letter-spacing:-.02em;font-weight:640}
  .head p{margin-top:10px;font-size:14px;line-height:1.75;color:var(--ink2);max-width:900px}
  .legend{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}

  .grid{max-width:1840px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:60px 44px;justify-items:center}

  figure{display:flex;flex-direction:column;align-items:center;gap:16px}
  .cap{font-size:13px;font-weight:650;letter-spacing:.02em;color:var(--ink)}
  .cap span{color:var(--ink3);font-weight:500;margin-right:8px;font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;line-height:1.7;color:var(--ink2);max-width:390px;text-align:left}
  .note b{color:var(--ink);font-weight:600}

  .phone{
    width:390px;height:844px;background:#fff;border-radius:40px;flex:none;
    box-shadow:0 24px 60px rgba(40,34,26,.16),0 3px 10px rgba(40,34,26,.07);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .sb{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:650}
  .sb .dots{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink)}
  .bar{width:22px;height:11px;border:1.4px solid var(--ink);border-radius:3px;position:relative}
  .bar::after{content:"";position:absolute;inset:1.5px;background:var(--ink);border-radius:1px;right:6px}

  .body{flex:1;display:flex;flex-direction:column;overflow:hidden}

  .hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 14px}
  .hdr h2{font-size:25px;font-weight:660;letter-spacing:-.02em}
  .hdr .act{font-size:20px;color:var(--ink2);width:30px;text-align:center}
  .hdr .back{font-size:19px;color:var(--ink2);width:26px;white-space:nowrap}
  .hdr .back.txt{font-size:13.5px;color:var(--ink2);width:auto;min-width:26px}
  .hdr .step{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* roles */
  .roles{display:flex;gap:8px;padding:0 20px 14px;overflow:hidden}
  .role{flex:none;padding:7px 15px;border-radius:19px;font-size:13px;color:var(--ink2);background:var(--soft);font-weight:540}
  .role.on{background:var(--ink);color:#fff}
  .role.add{padding:7px 12px;color:var(--ink3);background:#fff;border:1px dashed var(--line)}

  .filters{display:flex;gap:8px;padding:0 20px 14px}
  .chip{flex:none;padding:6px 12px;border-radius:14px;font-size:12px;color:var(--ink2);border:1px solid var(--line);background:#fff}
  .chip.sq{width:30px;text-align:center;padding:6px 0}

  .grid3{flex:1;overflow:hidden;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .tile{display:flex;flex-direction:column;gap:5px}
  .timg{aspect-ratio:1;border-radius:9px;background:var(--tile);display:flex;align-items:center;justify-content:center;position:relative}
  .timg svg{width:66%;height:66%}
  .tname{font-size:10.5px;color:var(--ink2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;right:5px;bottom:5px;background:rgba(255,255,255,.9);border-radius:7px;padding:1px 5px;font-size:8.5px;color:var(--ink2);font-weight:600}

  .tabbar{flex:none;height:76px;border-top:1px solid var(--line);display:flex;align-items:flex-start;padding-top:9px;background:#fff;position:relative}
  .tbi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink3)}
  .tbi.on{color:var(--ink)}
  .tbi svg{width:21px;height:21px}
  .fab{display:none}
  .addbtn{display:flex;align-items:center;gap:5px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:7px 14px 7px 11px;border-radius:16px}
  .addbtn span{font-size:15px;font-weight:300;line-height:1}

  /* generic rows */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 20px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--ink2)}
  .row .v{color:var(--ink);font-weight:560;display:flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}

  .btnrow{display:flex;gap:10px;padding:14px 20px}
  .btn{flex:1;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink2)}
  .btn.pri{background:var(--ink);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line)}

  .hint{font-size:11px;color:var(--ink3);text-align:center;padding:2px 20px 0}

  /* confirm screen */
  .bigimg{margin:4px 20px 0;aspect-ratio:1/.92;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;position:relative}
  .bigimg svg{width:52%;height:52%}
  .lowconf{position:absolute;left:12px;top:12px;background:#FBEDD9;color:#8A5A18;font-size:10.5px;font-weight:640;padding:4px 9px;border-radius:8px}
  .segtoggle{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px}
  .segtoggle span{padding:5px 13px;border-radius:8px;font-size:11.5px;color:var(--ink2)}
  .segtoggle span.on{background:#fff;color:var(--ink);font-weight:620;box-shadow:0 1px 3px rgba(0,0,0,.07)}

  /* detail */
  .hero{height:258px;flex:none;margin:0;background:var(--tile);display:flex;align-items:center;justify-content:center;position:relative}
  .hero svg{width:42%;height:42%}
  .dotsrow{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px}
  .dt{width:5px;height:5px;border-radius:3px;background:rgba(38,35,31,.2)}
  .dt.on{width:14px;background:var(--ink)}
  .dt.worn{background:rgba(140,106,79,.45)}
  .wornstrip{display:flex;gap:9px;padding:4px 20px 0;overflow:hidden}
  .wthumb{width:74px;flex:none}
  .wthumb .im{width:74px;height:88px;border-radius:9px;background:var(--tile);display:flex;align-items:center;justify-content:center}
  .wthumb .im svg{width:60%;height:60%}
  .wthumb .dt2{font-size:9.5px;color:var(--ink3);margin-top:4px;text-align:center}
  .wadd{width:74px;height:88px;border-radius:9px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:20px}
  .sectitle{font-size:11px;font-weight:660;color:var(--ink3);letter-spacing:.06em;padding:16px 20px 8px}

  /* camera */
  .cam{flex:1;background:#ECE9E2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cam .sheet{width:250px;height:290px;background:#FBF9F5;border-radius:12px;box-shadow:0 10px 30px rgba(60,50,38,.14);display:flex;align-items:center;justify-content:center}
  .cam .sheet svg{width:70%;height:70%}
  .vf{position:absolute;inset:52px 40px 150px;border-radius:6px}
  .vf i{position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.85)}
  .vf i:nth-child(1){left:0;top:0;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .vf i:nth-child(2){right:0;top:0;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .vf i:nth-child(3){left:0;bottom:0;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .vf i:nth-child(4){right:0;bottom:0;border-left:none;border-top:none;border-radius:0 0 6px 0}
  .camtip{position:absolute;left:0;right:0;bottom:118px;text-align:center;font-size:11.5px;color:#5C554A;line-height:1.6}
  .cambottom{flex:none;background:#fff;padding:14px 20px 22px}
  .filmstrip{display:flex;gap:7px;margin-bottom:16px;align-items:center}
  .film{width:44px;height:52px;border-radius:7px;background:var(--tile);display:flex;align-items:center;justify-content:center}
  .film svg{width:62%;height:62%}
  .shutterRow{display:flex;align-items:center;justify-content:space-between}
  .shutter{width:66px;height:66px;border-radius:33px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
  .shutter div{width:50px;height:50px;border-radius:25px;background:var(--ink)}
  .gallery{width:46px;height:46px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px}

  /* person page */
  .phead{display:flex;flex-direction:column;align-items:center;padding:6px 20px 18px}
  .avatar{width:66px;height:66px;border-radius:33px;background:#D9D2C6;color:#6B6152;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:640}
  .pname{font-size:19px;font-weight:660;margin-top:11px}
  .psub{font-size:11.5px;color:var(--ink3);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin:0 20px}
  .stat{background:#fff;padding:13px 10px;text-align:center}
  .stat .n{font-size:17px;font-weight:660;letter-spacing:-.01em}
  .stat .n small{font-size:10px;font-weight:500;color:var(--ink3);margin-left:1px}
  .stat .l{font-size:10.5px;color:var(--ink3);margin-top:3px}
  .delta{margin:10px 20px 0;font-size:11.5px;color:#4C7A55;background:#EDF3EC;border-radius:9px;padding:8px 12px}
  .hlist{margin:0 20px}
  .hitem{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
  .hitem .r{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}

  /* chart */
  .chartbox{margin:4px 20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px 6px}
  .chartbox svg{width:100%;height:auto;display:block}

  /* settings */
  .sect{margin-top:22px}
  .sect .st{font-size:11px;font-weight:660;color:var(--ink3);letter-spacing:.06em;padding:0 22px 8px}
  .list{background:#fff;margin:0 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .li{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .li:last-child{border-bottom:none}
  .li .chev{color:var(--ink3);font-size:15px}
  .toggle{width:40px;height:24px;border-radius:12px;background:var(--ink);position:relative}
  .toggle::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#fff}
  .storage{margin:14px 20px 0;font-size:11px;color:var(--ink3)}
  .storagebar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
  .storagebar div{height:100%;width:62%;background:var(--ink)}

  /* forms */
  .fld{margin:0 20px 0}
  .fld label{display:block;font-size:11px;font-weight:660;color:var(--ink3);letter-spacing:.06em;padding:16px 0 7px}
  .input{height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;padding:0 14px;font-size:14.5px}
  .input.ph{color:var(--ink3);font-size:14px}
  .input .cur{width:1.5px;height:19px;background:var(--ink);margin-left:1px}
  .input .unit{color:var(--ink3);font-size:12.5px;margin-left:6px}
  .inline2{display:flex;gap:10px}
  .inline2 .input{flex:1}
  .picks{display:flex;gap:8px;flex-wrap:wrap}
  .pick{padding:9px 15px;border-radius:11px;background:var(--soft);font-size:13px;color:var(--ink2)}
  .pick.on{background:var(--ink);color:#fff;font-weight:600}
  .avatarpick{display:flex;align-items:center;gap:14px;padding:6px 20px 2px}
  .avbig{width:72px;height:72px;border-radius:36px;background:var(--soft);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--ink3)}
  .avbig .p{font-size:19px;font-weight:300;line-height:1}
  .avtip{flex:1;font-size:11px;line-height:1.7;color:var(--ink3)}
  .emptynote{font-size:11px;line-height:1.7;color:var(--ink3);padding:7px 20px 0}
  .partline{display:flex;align-items:center;gap:10px;padding:0 20px}
  .partline .hr{flex:1;height:1px;background:var(--line)}
  .partline span{font-size:10.5px;color:var(--ink3);letter-spacing:.08em}
  .stickyhdr{margin-top:auto;background:#fff;border-top:1px solid var(--line);padding:12px 20px 28px}
  .tinyinfo{font-size:10.5px;color:var(--ink3);line-height:1.7;padding:10px 20px 0}
  .badge2{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:640;color:#4C7A55;background:#EDF3EC;border-radius:7px;padding:3px 7px}

  /* 2-col compact measurement grid */
  .ghdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 7px}
  .ghdr .t{font-size:10.5px;font-weight:660;color:var(--ink3);letter-spacing:.06em}
  .ghdr .r{font-size:9.5px;color:var(--ink3)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin:0 20px}
  .cell .lb{font-size:10px;color:var(--ink3);margin-bottom:3px}
  .cell .iv{height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;padding:0 10px;font-size:13.5px;font-weight:560}
  .cell .iv .u{font-size:11px;color:var(--ink3);font-weight:500;margin-left:3px}
  .cell .iv.empty{color:var(--ink3);font-weight:400;font-size:13px;background:#FAF9F6;box-shadow:inset 0 0 0 1px var(--line)}
  .cell .iv.empty .u{color:#C6C0B7}
  .morelink{margin:12px 20px 0;font-size:11.5px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center}
  .morelink .r{color:var(--ink3);font-size:13px}

  /* compact 15-row table */
  .tbl{margin:0 20px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .tbl .th{padding:9px 14px;background:var(--soft);font-size:9.5px;font-weight:660;color:var(--ink3);letter-spacing:.07em;display:flex;justify-content:space-between}
  .mrow{padding:0 14px;height:33px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow .v{display:flex;gap:13px;align-items:center;font-variant-numeric:tabular-nums}
  .mrow .v b{font-weight:620;font-size:12.5px}
  .mrow .v .pv{font-size:11px;color:var(--ink3)}
  .mrow .v .dv{font-size:10.5px;min-width:22px;text-align:right}
  .mrow .v .up{color:#A8574B}
  .mrow .v .dn{color:#4C7A55}
  .mrow .v .fl{font-size:11.5px;color:#C6C0B7}
</style>
</head>
