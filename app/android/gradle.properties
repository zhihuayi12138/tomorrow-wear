org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project used to live under a path with Chinese characters (renamed to
# D:\mingtian-chuanshenme on 2026-11-03). Keep the override so the build still
# works if the folder is ever renamed back.
android.overridePathCheck=true
# Two problems on this machine, both worked around here:
# 1. The pub cache sits on C: while the project is on D:, and the Kotlin
#    incremental compiler cannot relativise paths across drives ("this and base
#    files have different roots"). Turning incremental compilation off avoids it.
# 2. Gradle keeps a lot of state; the daemon occasionally wedges between builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
org.gradle.daemon=false
